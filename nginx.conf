server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # PWA installed from GitHub Pages registered scope /face-recognition-pomodoro/.
    # Strip that prefix so the already-installed PWA can load assets from this local server.
    location /face-recognition-pomodoro/ {
        rewrite ^/face-recognition-pomodoro/(.*)$ /$1 last;
    }
    location = /face-recognition-pomodoro {
        return 301 /;
    }

    location / {
        try_files $uri /index.html;
    }
}
